# =============================================================================
# FocusTrack — Nginx HTTPS Reverse Proxy
# =============================================================================
# Place your TLS certificate and key in:
#   nginx/certs/cert.pem   — the full-chain certificate
#   nginx/certs/key.pem    — the private key
#
# For internal domains (e.g. apps.homelab1367.internal), generate certs with:
#   mkcert apps.homelab1367.internal
# Or use your homelab CA / Proxmox-signed cert.
# =============================================================================

# Dynamically set Connection header:
#   - WebSocket upgrade requests  → "upgrade"
#   - Regular HTTP requests       → "close"  (so Nginx doesn't break keep-alive)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS termination + reverse proxy
server {
    listen 443 ssl;
    server_name _;

    # ── TLS Certificates ──────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # ── TLS Hardening ─────────────────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # ── Socket.IO — WebSocket + long-polling passthrough ──────────────────────
    # Must be matched before the catch-all location /
    # proxy_buffering off is critical — Socket.IO long-polling hangs with buffering on
    location /socket.io/ {
        proxy_pass         http://frontend:5180;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (uses map above)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Disable buffering — required for real-time streaming and long-polling
        proxy_buffering    off;

        # Long timeouts for persistent WebSocket connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── All other traffic → frontend (serves React SPA + proxies /api/) ───────
    location / {
        proxy_pass         http://frontend:5180;
        proxy_http_version 1.1;

        # Use map — regular HTTP requests must NOT send "upgrade" Connection header
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
