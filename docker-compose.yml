version: '3.8'

services:
  backend:
    build: ./server
    container_name: backend_container
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_USER=root
      - DATABASE_PASSWORD=root
      - DATABASE_NAME=aispt
      - FLASK_ENV=development
      - DB_MODE=local
      - GUNICORN_CMD_ARGS="--reload"
    networks:
      - mynetwork

  frontend:
    build: ./client
    container_name: frontend_container
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules  # Prevents overwriting node_modules
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - mynetwork

  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: AISPT
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:

networks:
  mynetwork: