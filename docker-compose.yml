services:
  backend:
    build: ./server
    container_name: backend_container
    ports:
      - "5555:5555"
    # No bind mounts — code is baked into the image at build time
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - mynetwork

  frontend:
    build: ./client
    container_name: frontend_container
    ports:
      - "5180:80"   # Nginx serves on 80 internally; mapped to 5180 externally
    depends_on:
      - backend
    restart: always
    networks:
      - mynetwork

  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env                # MYSQL_ROOT_PASSWORD and MYSQL_DATABASE loaded from .env
    # Port 3306 is NOT exposed to the host — only accessible within mynetwork
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:

networks:
  mynetwork:
