version: '3.8'

services:
  backend:
    build: ./server
    container_name: backend_container
    ports:
      - "5555:5555"
    volumes:
      - ./server:/app
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - GUNICORN_CMD_ARGS=--workers=1 --threads=2 --timeout=120 --reload
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - mynetwork

  frontend:
    build: ./client
    container_name: frontend_container
    ports:
      - "5180:5180"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: always
    networks:
      - mynetwork

  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: AISPT
    ports:
      - "3320:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:

networks:
  mynetwork:
