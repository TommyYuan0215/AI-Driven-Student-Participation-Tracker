services:
  backend:
    build: ./server
    container_name: backend_container
    ports:
      - "5555:5555"
    # No bind mounts — code is baked into the image at build time
    env_file:
      - .env
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - mynetwork

  frontend:
    build: ./client
    container_name: frontend_container
    ports:
      - "5180:5180"   # Nginx serves on 5180 internally; mapped to 5180 externally
    depends_on:
      - backend
    restart: always
    networks:
      - mynetwork

networks:
  mynetwork:
